events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name dmitriykhristich.nomorepartiesco.ru;

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 default_server ssl;

        server_name dmitriykhristich.nomorepartiesco.ru;

        ssl_certificate /etc/letsencrypt/live/dmitriykhristich.nomorepartiesco.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dmitriykhristich.nomorepartiesco.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_stapling on;
        ssl_stapling_verify on;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            root /var/www/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            add_header Access-Control-Allow-Origin *;
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /content/ {
            add_header Access-Control-Allow-Origin *;
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        types {
            text/html html htm shtml;
            text/css css;
            text/xml xml;
            image/gif gif;
            image/jpeg jpeg jpg;
            application/javascript js;
            text/plain txt;
            image/png png;
            image/svg+xml svg svgz;
            image/webp webp;
            application/java-archive jar war ear;
            application/msword doc;
            application/pdf pdf;
            application/vnd.ms-excel xls;
            application/x-7z-compressed 7z;
            application/x-rar-compressed rar;
            application/x-x509-ca-cert der pem crt;
            application/zip zip;
            audio/mpeg mp3;
            audio/x-m4a m4a;
            video/mp4 mp4;
            video/quicktime mov;
        }
    }
}